baseurl: ''
permalink: pretty
title: 'RIPEDA Consulting'

# Enhanced Site metadata for SEO
description: "Calgary's Apple Technical Partners. Over 13 years managing Apple devices for businesses, education, and enterprises."
url: "https://ripeda.com"
locale: en_CA
timezone: America/Edmonton

# Industry keywords for SEO
keywords: "Apple consulting Calgary, Mac support, IT services Calgary, Apple certified consultants, dental practice IT, education technology, marketing agency IT, office IT support, SaaS company IT, law firm technology, Apple Technical Partners, ACN, ATP"

# SEO-specific settings
seo:
  type: Organization
  name: RIPEDA Consulting
  links:
    - https://www.linkedin.com/company/ripeda-consulting
    - https://twitter.com/ripedaconsulting

# Business Information for Local SEO
business:
  name: "RIPEDA Consulting"
  founded: 2011
  street_address: "300 - 1301 8 Street SW"
  city: "Calgary" 
  province: "Alberta"
  postal_code: "T2R 1B7"
  country: "Canada"
  phone: "+1-844-474-7332"
  email: "info@ripeda.com"
  
# Social Media
social:
  name: RIPEDA Consulting
  links:
    - https://www.linkedin.com/company/ripeda-consulting
    - https://twitter.com/ripedaconsulting

# Default SEO settings
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      image: "/images/logo/ripeda-og-image.jpg"
      keywords: "Apple consulting Calgary, Mac support, IT services Calgary, Apple certified consultants, dental practice IT, education technology, marketing agency IT, office IT support, SaaS company IT, law firm technology, Apple Technical Partners, ACN, ATP"
  - scope:
      path: ""
      type: "services"
    values:
      layout: "default"
      image: "/images/logo/ripeda-og-image.jpg"
      keywords: "Apple consulting Calgary Alberta, Mac support, IT services Calgary, Apple certified consultants, dental practice IT, education technology, marketing agency IT, office IT support, SaaS company IT, law firm technology, Apple Technical Partners, ACN, ATP"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"
      image: "/images/logo/ripeda-og-image.jpg"
# Logo for SEO plugin (simple string)
logo: "/images/logo/logo.png"

# Theme logo configuration
theme_logo:
  mobile: "/images/logo/logo-mobile.svg"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "/images/logo/logo.png"
  desktop_height: "32px"
  desktop_width: "auto"

home:
  limit_services: 6

# Collections
collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true
  insights:
    output: true
    permalink: /resources/insights/:path/
    sort_by: date
  business_resources:
    output: false

# Files to include
include:
  - "*.html"

# Files and folders to exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
  - "*.log"
  - "package*.json"
  - ".git/"
  - ".sass-cache/"
  - ".jekyll-cache/"
  - ".bundle/"
  - "spec/"
  - "test/"
  - ".env*"
  - "*.key"
  - "*.pem"
  - "docker-compose.yml"
  - "Dockerfile"
  - "_compress_images_cache.yml"
  - "scripts/"
  - "skills/"
  - ".claude/"
  - "TODO.md"
  # Cloudflare Worker source. Deployed to Cloudflare separately, NOT part of
  # the Jekyll build — excluded so these .js files are never published.
  - "cloudflare-workers/"
  - "ripeda-website-redesign-strategy.md"
  - "DEVELOPMENT_RULES.md"
  - "spoke-topic-brainstorm.md"
  - "strategy-advisory-engagement-playbook.md"
  - "strategy-advisory-engagement-playbook.docx"
  - "globe-demo.html"
  - "globe-demo-fixed.html"
  - "globe-demo-standalone.html"
  - "og-image-mockup.html"

# Plugins
plugins:
  - jekyll-environment-variables
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-minifier
#  - jekyll-compress-images

# Jekyll Minifier settings
jekyll-minifier:
  preserve_php: true
  remove_spaces_inside_tags: true
  remove_multi_spaces: true
  remove_comments: true
  remove_intertag_spaces: true
  remove_quotes: false
  compress_css: true
  compress_javascript: true
  compress_json: true
  simple_doctype: false
  remove_script_attributes: false
  remove_style_attributes: false
  remove_link_attributes: false
  remove_form_attributes: false
  remove_input_attributes: false
  remove_javascript_protocol: false
  remove_http_protocol: false
  remove_https_protocol: false
  preserve_line_breaks: false
  simple_boolean_attributes: false

# Jekyll SEO Tag settings
tag: {}

# Sass configuration
sass:
  style: compressed

# MIME type configuration for video files
webrick:
  headers:
    '**/*.mov': 'video/quicktime'
    '**/*.mp4': 'video/mp4'

# Site navigation
navigation:
  - title: "Services"
    url: "#services"
  - title: "Device as a Service"
    url: "/daas/"
  - title: "Repairs"
    url: "/repairs/"
  - title: "About"
    url: "/team/"
  - title: "FAQ"
    url: "/faq/"
  - title: "Contact"
    url: "/contact/"

# Sitemap settings
sitemap:
  priority: 1.0
  changefreq: 'monthly'
  lastmod: "2025-09-28"
