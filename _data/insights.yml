verticals:
  - id: dental-medical
    label: "Dental & Medical"
    description: "Apple IT for clinics, dental practices, and healthcare environments. PHIPA compliance, digital imaging workflows, secure remote access, and device management — written for Practice Managers and Owners."

  - id: design-agencies
    label: "Design & Marketing"
    description: "The Mac is already on every desk. These articles help design studios, creative shops, and marketing agencies get more out of it — storage strategy, AI-assisted workflows, MDM for onboarding, campaign asset management, and collaboration without friction."

  - id: education
    label: "Education"
    description: "iPad and Mac deployments for K–12 schools and post-secondary institutions. Practical guides for IT coordinators, principals, and school board staff on every stage of the device lifecycle."

  - id: professional-services
    label: "Professional Services"
    description: "Apple in law firms, accounting practices, SaaS companies, and consulting shops. Focused on data protection, staff onboarding, and keeping a lean IT footprint without sacrificing security."

  # NOTE: `marketing-agencies` was merged into `design-agencies` on 2026-08-21.
  # It was defined here with a full label and description but never carried a
  # single article, so it rendered a filter tab that led straight to the empty
  # state. The two audiences overlap almost completely for this content, and
  # `design-agencies` is the id that is load-bearing elsewhere: it owns
  # /industries/design-agencies/, which is linked from index.html and
  # _data/menus.yml, and pillar pages deep-link the hub as #design-agencies.
  # So the id stayed and only the label widened. Do not re-add a separate
  # marketing vertical without writing articles for it first.

  - id: mdm-security
    label: "MDM & Security"
    description: "Cross-industry technical depth on mobile device management, encryption, endpoint security, and Apple's enterprise toolset. Written for IT decision-makers, not just Apple shops."

  - id: infrastructure
    label: "Apple Infrastructure"
    description: "Networks, servers, storage, and everything that sits behind the devices. Guides for building Apple-compatible infrastructure that scales without requiring a Microsoft backbone."

  - id: ai-productivity
    label: "AI & Productivity"
    description: "What Apple Silicon and on-device AI actually change for business teams — from Shortcuts automation to Apple Intelligence — and how to roll these tools out without creating support debt."

