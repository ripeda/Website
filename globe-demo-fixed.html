<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Globe Demo - RIPEDA Consulting</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8f9fa;
        }

        .globe-demo-section {
            padding: 40px 20px;
            background: #f8f9fa;
        }

        .globe-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            text-align: center;
        }

        h1 {
            color: #2f2f41;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .globe-wrapper {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin: 40px auto;
            max-width: 700px;
        }

        #globeContainer {
            width: 100%;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            background: #000;
        }

        .globe-info {
            margin-top: 30px;
            padding: 20px;
            background: #f0f7ff;
            border-radius: 12px;
            border-left: 4px solid #609bc3;
        }

        .countries-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .country-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .country-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #609bc3;
            flex-shrink: 0;
        }

        .loading-message {
            color: #666;
            font-style: italic;
            padding: 50px;
        }

        .controls {
            margin: 20px 0;
            text-align: center;
        }

        .control-btn {
            background: #609bc3;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .control-btn:hover {
            background: #4a7a9e;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .globe-wrapper {
                padding: 20px;
            }

            #globeContainer {
                height: 400px;
            }

            .countries-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <section class="globe-demo-section">
        <div class="globe-container">
            <h1>Global Reach Interactive Globe</h1>
            <p>Drag to rotate • Touch and swipe on mobile • Auto-rotates when idle</p>

            <div class="globe-wrapper">
                <div id="globeContainer">
                    <div class="loading-message">Loading globe...</div>
                </div>

                <div class="controls">
                    <button class="control-btn" onclick="globe.toggleAutoRotate()">Toggle Auto-Rotation</button>
                    <button class="control-btn" onclick="globe.resetView()">Reset View</button>
                </div>

                <div class="globe-info">
                    <h3>Countries We've Supported</h3>
                    <div class="countries-list">
                        <div class="country-item">
                            <div class="country-dot"></div>
                            <span>Canada</span>
                        </div>
                        <div class="country-item">
                            <div class="country-dot"></div>
                            <span>United States</span>
                        </div>
                        <div class="country-item">
                            <div class="country-dot"></div>
                            <span>Mexico</span>
                        </div>
                        <div class="country-item">
                            <div class="country-dot"></div>
                            <span>China</span>
                        </div>
                    </div>
                    <p style="margin-top: 15px; font-size: 0.9rem; color: #666;">
                        Highlighted regions show countries where RIPEDA has provided Apple consulting and technical services.
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        class InteractiveGlobe {
            constructor(containerId, options = {}) {
                this.container = document.getElementById(containerId);

                this.options = {
                    width: 500,
                    height: 500,
                    autoRotate: true,
                    rotationSpeed: 0.005,
                    highlightedCountries: ['CA', 'US', 'MX', 'CN']
                };

                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.globeGroup = null;
                this.isUserInteracting = false;
                this.autoRotateEnabled = true;
                this.mouse = new THREE.Vector2();
                this.isMouseDown = false;

                this.init();
            }

            init() {
                this.container.innerHTML = '';
                this.setupScene();
                this.createGlobe();
                this.addCountryMarkers();
                this.setupControls();
                this.setupResize();
                this.animate();
            }

            setupScene() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x000022);

                // Camera
                this.camera = new THREE.PerspectiveCamera(50, 1, 1, 1000);
                this.camera.position.set(0, 0, 300);

                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(this.options.width, this.options.height);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.container.appendChild(this.renderer.domElement);

                // Lighting - brighter for better earth visibility
                const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
                directionalLight.position.set(-1, 0.5, 1);
                this.scene.add(directionalLight);

                // Add fill light for even illumination
                const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
                directionalLight2.position.set(1, -0.5, -1);
                this.scene.add(directionalLight2);

                // Create group for globe and markers
                this.globeGroup = new THREE.Group();
                this.scene.add(this.globeGroup);
            }

            createGlobe() {
                const geometry = new THREE.SphereGeometry(100, 50, 50);

                // Create material first with blue fallback
                const material = new THREE.MeshLambertMaterial({
                    color: 0x6699cc,
                    transparent: false,
                    opacity: 1.0
                });

                const globe = new THREE.Mesh(geometry, material);
                this.globeGroup.add(globe);

                // Try to load earth texture
                const loader = new THREE.TextureLoader();
                loader.load(
                    'https://raw.githubusercontent.com/turban/webgl-earth/master/images/2_no_clouds_4k.jpg',
                    // onLoad - texture loaded successfully
                    (texture) => {
                        console.log('Earth texture loaded successfully');
                        material.map = texture;
                        material.color.setHex(0xffffff); // Remove blue tint when texture loads
                        material.needsUpdate = true;
                    },
                    // onProgress
                    undefined,
                    // onError - texture failed to load
                    (error) => {
                        console.log('Primary texture failed, trying backup...');
                        // Try backup texture
                        loader.load(
                            'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
                            (texture) => {
                                console.log('Backup texture loaded');
                                material.map = texture;
                                material.color.setHex(0xffffff);
                                material.needsUpdate = true;
                            },
                            undefined,
                            () => {
                                console.log('All textures failed, keeping blue globe');
                            }
                        );
                    }
                );
            }

            addCountryMarkers() {
                const countries = [
                    { code: 'CA', name: 'Canada', lat: 54, lng: -95, highlighted: true },
                    { code: 'US', name: 'United States', lat: 40, lng: -100, highlighted: true },
                    { code: 'MX', name: 'Mexico', lat: 23, lng: -102, highlighted: true },
                    { code: 'CN', name: 'China', lat: 35, lng: 104, highlighted: true }
                ];

                countries.forEach(country => {
                    this.addMarker(country);
                });
            }

            addMarker(country) {
                // Convert lat/lng to radians
                const lat = country.lat * Math.PI / 180;
                const lng = country.lng * Math.PI / 180;
                const radius = 103; // Just above globe surface

                // Correct spherical to cartesian conversion with longitude offset
                // Add π to longitude to fix the 180-degree shift
                const adjustedLng = lng + Math.PI;
                const x = -radius * Math.cos(lat) * Math.cos(adjustedLng);
                const y = radius * Math.sin(lat);
                const z = radius * Math.cos(lat) * Math.sin(adjustedLng);

                const geometry = new THREE.SphereGeometry(country.highlighted ? 3 : 2, 12, 12);
                const material = new THREE.MeshBasicMaterial({
                    color: country.highlighted ? 0xff3742 : 0xffffff,
                    transparent: false,
                    opacity: 1.0
                });

                const marker = new THREE.Mesh(geometry, material);
                marker.position.set(x, y, z);

                // Simple glow effect for highlighted countries (no rings!)
                if (country.highlighted) {
                    const glowGeometry = new THREE.SphereGeometry(5, 12, 12);
                    const glowMaterial = new THREE.MeshBasicMaterial({
                        color: 0xff6b6b,
                        transparent: true,
                        opacity: 0.3
                    });
                    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                    glow.position.copy(marker.position);
                    this.globeGroup.add(glow);
                }

                this.globeGroup.add(marker);
            }

            setupControls() {
                const canvas = this.renderer.domElement;

                // Mouse events
                canvas.addEventListener('mousedown', (e) => {
                    this.isMouseDown = true;
                    this.isUserInteracting = true;
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                    canvas.style.cursor = 'grabbing';
                });

                canvas.addEventListener('mousemove', (e) => {
                    if (!this.isMouseDown) return;

                    const deltaX = e.clientX - this.mouse.x;
                    const deltaY = e.clientY - this.mouse.y;

                    this.globeGroup.rotation.y += deltaX * 0.005;
                    this.globeGroup.rotation.x += deltaY * 0.005;

                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });

                canvas.addEventListener('mouseup', () => {
                    this.isMouseDown = false;
                    canvas.style.cursor = 'grab';
                    setTimeout(() => {
                        this.isUserInteracting = false;
                    }, 2000);
                });

                // Touch events
                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.isMouseDown = true;
                    this.isUserInteracting = true;
                    this.mouse.x = touch.clientX;
                    this.mouse.y = touch.clientY;
                });

                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!this.isMouseDown) return;

                    const touch = e.touches[0];
                    const deltaX = touch.clientX - this.mouse.x;
                    const deltaY = touch.clientY - this.mouse.y;

                    this.globeGroup.rotation.y += deltaX * 0.005;
                    this.globeGroup.rotation.x += deltaY * 0.005;

                    this.mouse.x = touch.clientX;
                    this.mouse.y = touch.clientY;
                });

                canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.isMouseDown = false;
                    setTimeout(() => {
                        this.isUserInteracting = false;
                    }, 2000);
                });

                canvas.style.cursor = 'grab';
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Auto-rotation
                if (this.autoRotateEnabled && !this.isUserInteracting) {
                    this.globeGroup.rotation.y += this.options.rotationSpeed;
                }

                this.renderer.render(this.scene, this.camera);
            }

            toggleAutoRotate() {
                this.autoRotateEnabled = !this.autoRotateEnabled;
            }

            resetView() {
                this.globeGroup.rotation.set(0, 0, 0);
            }

            setupResize() {
                window.addEventListener('resize', () => {
                    const rect = this.container.getBoundingClientRect();
                    const size = Math.min(rect.width, rect.height, 500);

                    this.camera.aspect = 1;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(size, size);
                });
            }
        }

        let globe;

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof THREE === 'undefined') {
                document.getElementById('globeContainer').innerHTML =
                    '<div class="loading-message">Failed to load 3D library. Please check your connection.</div>';
                return;
            }

            globe = new InteractiveGlobe('globeContainer');
        });
    </script>
</body>
</html>
